version: "3.7"
services:
  elasticsearch:
    build:
      context: .
      dockerfile: Dockerfile.elasticsearch
    container_name: knowledgeuni-elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    networks:
      - knowledgeuni-network
    #    command: >
    #      bash -c '
    #      if ! elasticsearch-plugin list | grep -q "analysis-icu"; then
    #        elasticsearch-plugin install analysis-icu
    #      else
    #        tail -f /dev/null &
    #      fi'
    restart: always
    volumes:
      - es-data:/usr/share/elasticsearch/data

#  logstash:
#    image: docker.elastic.co/logstash/logstash:8.15.2
#    container_name: knowledgeuni-logstash
#    ports:
#      - "5044:5044"
#    volumes:
#      - "./logstash-ingest-data/:/usr/share/logstash/ingest_data/"
#      - "./logstash-config/logstash.conf:/usr/share/logstash/pipeline/logstash.conf"
#    restart: always
#    networks:
#      - knowledgeuni-network
#
#  kibana:
#    image: docker.elastic.co/kibana/kibana:8.15.2
#    container_name: knowledgeuni-kibana
#    ports:
#      - "5601:5601"
#    networks:
#      - knowledgeuni-network
#    restart: always

  minio:
    image: quay.io/minio/minio:latest
    container_name: knowledgeuni-minio
    ports:
      - 9000:9000
      - 9090:9090
    environment:
      - MINIO_ROOT_USER=ROOTUSER
      - MINIO_ROOT_PASSWORD=CHANGEME123
    command: server /data --console-address ":9090"
    volumes:
      - minio-data:/data
    restart: always
    networks:
      - knowledgeuni-network

networks:
  knowledgeuni-network:
    name: knowledgeuni-network

volumes:
  es-data:
  minio-data:
